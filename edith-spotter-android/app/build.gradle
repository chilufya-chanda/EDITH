plugins {
    id 'com.android.application'
}

android {
    namespace 'com.edith.spotter'
    compileSdk 34

    defaultConfig {
        applicationId "com.edith.spotter"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "2.0.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        viewBinding true
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core:1.13.1'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.fragment:fragment:1.8.2'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'

    // CameraX — capture pipeline for the spotting feed.
    def camerax_version = "1.3.4"
    implementation "androidx.camera:camera-core:$camerax_version"
    implementation "androidx.camera:camera-camera2:$camerax_version"
    implementation "androidx.camera:camera-lifecycle:$camerax_version"
    implementation "androidx.camera:camera-view:$camerax_version"

    // ML Kit on-device face DETECTION only (not recognition/embedding —
    // this app never computes or compares embeddings itself; it only
    // asks "is there a face worth cropping and sending to the backend").
    implementation 'com.google.mlkit:face-detection:16.1.7'

    // REST calls to the FastAPI backend.
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}
